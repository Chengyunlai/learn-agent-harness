name: Verify Python examples

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python examples/s01-agent-loop/user_code/practice.py
      - run: python examples/s01-agent-loop/user_code/verify_practice.py
      - run: python examples/s01-agent-loop/user_code/reading_demo.py
      - run: python examples/s01-agent-loop/user_code/verify_reading.py
      - run: python examples/s01-agent-loop/user_code/verify_fixtures.py
      - run: python examples/s02-tool-use/user_code/practice.py
      - run: python examples/s02-tool-use/user_code/verify_practice.py
      - run: python examples/s02-tool-use/user_code/verify_fixtures.py
      - run: python examples/s03-permission/user_code/practice.py --decision deny
      - run: python examples/s03-permission/user_code/practice.py --decision allow
      - run: python examples/s03-permission/user_code/verify_practice.py
      - run: python examples/s03-permission/user_code/verify_fixtures.py
      - run: python examples/s04-hooks/user_code/practice.py --decision allow
      - run: python examples/s04-hooks/user_code/verify_practice.py
      - run: python examples/s04-hooks/user_code/verify_fixtures.py
      - run: python examples/s05-todo-write/user_code/practice.py --decision allow
      - run: python examples/s05-todo-write/user_code/verify_practice.py
      - run: python examples/s05-todo-write/user_code/verify_fixtures.py
      - run: python examples/s06-subagent/user_code/verify_practice.py
      - run: python examples/s06-subagent/user_code/verify_fixtures.py
      - run: python examples/s07-skills/user_code/verify_practice.py
      - run: python examples/s07-skills/user_code/verify_fixtures.py
      - run: python examples/s08-context-compact/user_code/verify_practice.py
      - run: python examples/s08-context-compact/user_code/verify_fixtures.py
      - run: python examples/s09-memory/user_code/verify_practice.py
      - run: python examples/s09-memory/user_code/verify_fixtures.py
      - run: python examples/s10-system-prompt/user_code/verify_practice.py
      - run: python examples/s10-system-prompt/user_code/verify_fixtures.py
      - run: python examples/s11-error-recovery/user_code/practice.py --decision allow
      - run: python examples/s11-error-recovery/user_code/verify_practice.py
      - run: python examples/s11-error-recovery/user_code/verify_fixtures.py
      - run: python examples/s12-task-system/user_code/verify_practice.py
      - run: python examples/s12-task-system/user_code/verify_fixtures.py
      - run: python examples/s13-background-tasks/user_code/verify_practice.py
      - run: python examples/s13-background-tasks/user_code/verify_fixtures.py
      - run: python examples/s14-cron-scheduler/user_code/verify_practice.py
      - run: python examples/s14-cron-scheduler/user_code/verify_fixtures.py
  sdk-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python examples/s01-agent-loop/user_code/verify_sdk.py
      - run: python examples/s02-tool-use/user_code/verify_sdk.py
      - run: python examples/s03-permission/user_code/verify_sdk.py
      - run: python examples/s04-hooks/user_code/verify_sdk.py
      - run: python examples/s05-todo-write/user_code/verify_sdk.py
      - run: python examples/s06-subagent/user_code/verify_sdk.py
      - run: python examples/s07-skills/user_code/verify_sdk.py
      - run: python examples/s08-context-compact/user_code/verify_sdk.py
      - run: python examples/s09-memory/user_code/verify_sdk.py
      - run: python examples/s10-system-prompt/user_code/verify_sdk.py
      - run: python examples/s11-error-recovery/user_code/verify_sdk.py
      - run: python examples/s12-task-system/user_code/verify_sdk.py
      - run: python examples/s13-background-tasks/user_code/verify_sdk.py
      - run: python examples/s14-cron-scheduler/user_code/verify_sdk.py
