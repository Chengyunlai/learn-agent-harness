name: Verify Python examples

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python examples/s01-agent-loop/user_code/practice.py
      - run: python examples/s01-agent-loop/user_code/verify_practice.py
  sdk-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python examples/s01-agent-loop/user_code/verify_sdk.py
